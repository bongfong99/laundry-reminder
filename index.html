<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laundry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230d9488'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle'%3E%F0%9F%A7%BA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f4f0;
    --card:#ffffff;
    --ink:#1a1a1a;
    --muted:#8d8b86;
    --line:#eae7e1;
    --track:#eeece7;
    --accent:#0d9488;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 24px 48px -24px rgba(0,0,0,.22);
  }
  body.due{ --accent:#d97706; }
  body.late{ --accent:#dc2626; }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{
    margin:0;
    display:grid;
    place-items:center;
    padding:22px;
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -12%, #ffffff 0%, rgba(255,255,255,0) 62%),
      var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ width:min(400px, 100%); }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 6px 14px;
  }
  .brand{
    display:flex; align-items:center; gap:9px;
    font-weight:650; font-size:15px; letter-spacing:.2px;
  }
  .logo{ font-size:19px; line-height:1; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line); background:#fff; color:var(--muted);
    font-size:15px; line-height:1; cursor:pointer;
    display:grid; place-items:center;
    transition:transform .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{ color:var(--ink); border-color:#dcd8d1; transform:rotate(25deg); }

  .card{
    background:var(--card);
    border-radius:28px;
    padding:26px 24px 22px;
    box-shadow:var(--shadow);
    border:1px solid #fff;
    text-align:center;
  }

  .ring-wrap{ position:relative; width:222px; height:222px; margin:2px auto 6px; }
  .ring{ width:100%; height:100%; display:block; }
  .ring circle{ fill:none; stroke-width:15; }
  .ring .track{ stroke:var(--track); }
  .ring .fill{
    stroke:var(--accent);
    stroke-linecap:round;
    transform:rotate(-90deg);
    transform-origin:120px 120px;
    transition:stroke-dashoffset .7s cubic-bezier(.22,.8,.3,1), stroke .5s ease, opacity .3s ease;
    filter:drop-shadow(0 4px 10px rgba(13,148,136,.18));
  }
  .ring-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
  }
  .big{
    font-size:62px; font-weight:700; letter-spacing:-2.5px;
    line-height:1; font-variant-numeric:tabular-nums;
    transition:color .35s ease;
  }
  .big.long{ font-size:38px; letter-spacing:-1px; }
  .label{
    font-size:10.5px; font-weight:700; letter-spacing:1.6px;
    color:var(--muted); text-transform:uppercase;
  }

  .status{
    margin:14px 0 18px; font-size:14px; color:#5c5a56; line-height:1.5;
  }
  .status b{ color:var(--ink); font-weight:600; }

  .actions{ display:grid; gap:9px; }
  button{ font-family:inherit; }
  .primary{
    width:100%; height:50px; border:0; border-radius:15px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:650;
    letter-spacing:.2px; cursor:pointer;
    transition:transform .12s ease, box-shadow .2s ease, background .4s ease;
    box-shadow:0 8px 20px -10px var(--accent);
  }
  .primary:hover{ transform:translateY(-1px); box-shadow:0 12px 24px -10px var(--accent); }
  .primary:active{ transform:translateY(0) scale(.99); }
  .ghost{
    width:100%; height:44px; border-radius:13px;
    background:transparent; border:1px solid var(--line); color:#6b6862;
    font-size:13.5px; font-weight:550; cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .ghost:hover{ background:#faf9f7; border-color:#e0dcd5; }

  .streak{
    margin-top:15px; font-size:12px; color:#96938d;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .streak b{ color:#5c5a56; }

  .hint{
    text-align:center; font-size:11.5px; color:#b0ada6;
    margin:14px 10px 0; line-height:1.5;
  }

  /* settings */
  .modal{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:rgba(30,28,26,.34);
    backdrop-filter:blur(3px);
    padding:20px;
  }
  .modal[hidden]{ display:none; }
  .panel{
    width:min(320px,100%);
    background:#fff; border-radius:22px; padding:22px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
    animation:pop .18s ease-out;
  }
  @keyframes pop{ from{ transform:scale(.96); opacity:0 } to{ transform:scale(1); opacity:1 } }
  .panel h2{ margin:0 0 18px; font-size:16px; letter-spacing:.2px; }
  .panel label{
    display:block; font-size:11px; font-weight:700; letter-spacing:1px;
    color:var(--muted); text-transform:uppercase; margin:0 0 8px;
  }
  .stepper{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--line); border-radius:13px; padding:6px;
    margin-bottom:18px;
  }
  .stepper button{
    width:34px; height:34px; border-radius:9px; border:0;
    background:#f5f3ef; color:var(--ink); font-size:18px; line-height:1;
    cursor:pointer;
  }
  .stepper button:hover{ background:#eeebe5; }
  .stepper span{ font-size:14px; font-weight:600; }
  input[type=date]{
    width:100%; height:42px; margin-bottom:18px;
    border:1px solid var(--line); border-radius:11px;
    padding:0 12px; font-family:inherit; font-size:13.5px; color:var(--ink);
    background:#fff;
  }
  .panel .primary{ height:44px; font-size:14px; }
  .link{
    display:block; width:100%; margin-top:10px; padding:8px;
    background:none; border:0; color:#a8a49d; font-size:12px;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .link:hover{ color:#dc2626; }

  /* confetti */
  .confetti{
    position:fixed; width:7px; height:11px; border-radius:2px;
    pointer-events:none; z-index:20;
    animation:fly .9s cubic-bezier(.2,.6,.4,1) forwards;
  }
  @keyframes fly{
    from{ transform:translate(-50%,-50%) rotate(0deg); opacity:1; }
    to{ transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)); opacity:0; }
  }
</style>
</head>
<body class="fresh">
  <div class="app">
    <header>
      <div class="brand"><span class="logo">🧺</span> Laundry</div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
    </header>

    <main class="card">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
          <circle class="track" cx="120" cy="120" r="104"></circle>
          <circle class="fill" id="ringFill" cx="120" cy="120" r="104"></circle>
        </svg>
        <div class="ring-center">
          <div class="big" id="bigNum">3</div>
          <div class="label" id="bigLabel">days left</div>
        </div>
      </div>

      <p class="status" id="status" aria-live="polite">Washed today · every 3 days</p>

      <div class="actions">
        <button class="primary" id="washBtn">I washed it ✓</button>
        <button class="ghost" id="snoozeBtn" hidden>Remind me tomorrow</button>
      </div>

      <div class="streak" id="streak" hidden>🔥 <b id="streakNum">0</b> washes on time</div>
    </main>

    <p class="hint">Leave this window open (or let it open with Windows) and the title bar will warn you on wash day.</p>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
      <h2 id="setTitle">Settings</h2>

      <label>Wash every</label>
      <div class="stepper">
        <button id="minusBtn" aria-label="Fewer days">−</button>
        <span id="intervalVal">3 days</span>
        <button id="plusBtn" aria-label="More days">+</button>
      </div>

      <label for="lastWash">Last washed</label>
      <input type="date" id="lastWash">

      <button class="primary" id="doneBtn">Done</button>
      <button class="link" id="resetBtn">Reset streak</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var DAY = 86400000;
  var KEY = "laundry.v1";
  var C = 2 * Math.PI * 104; // ring circumference

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- dates ---------- */
  function iso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function parse(s) {
    var p = s.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function today() { return iso(new Date()); }
  function addDays(s, n) {
    var d = parse(s);
    d.setDate(d.getDate() + n);
    return iso(d);
  }
  function diffDays(a, b) { // b - a
    return Math.round((parse(b) - parse(a)) / DAY);
  }
  function pretty(s) {
    var d = parse(s);
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  /* ---------- state ---------- */
  var STORAGE_OK = (function () {
    try {
      localStorage.setItem("__probe__", "1");
      localStorage.removeItem("__probe__");
      return true;
    } catch (e) {
      return false;
    }
  })();

  var defaults = { lastWashed: today(), interval: 3, snoozeUntil: null, onTime: 0, washes: 0 };
  var S = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return Object.assign({}, defaults);
      var p = JSON.parse(raw);
      if (!p || !p.lastWashed || !parse(p.lastWashed)) return Object.assign({}, defaults);
      return {
        lastWashed: p.lastWashed,
        interval: Math.min(30, Math.max(1, Number(p.interval) || 3)),
        snoozeUntil: p.snoozeUntil || null,
        onTime: Number(p.onTime) || 0,
        washes: Number(p.washes) || 0
      };
    } catch (e) {
      return Object.assign({}, defaults);
    }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* ---------- render ---------- */
  function render() {
    var t = today();
    var due = addDays(S.lastWashed, S.interval);
    var snoozed = !!(S.snoozeUntil && S.snoozeUntil > t);
    var effectiveDue = snoozed && S.snoozeUntil > due ? S.snoozeUntil : due;

    var left = diffDays(t, effectiveDue);   // >0 future, 0 today, <0 late
    var elapsed = diffDays(S.lastWashed, t);

    var freshness = Math.max(0, Math.min(1, left / S.interval));

    // ring
    var fill = $("ringFill");
    fill.style.strokeDasharray = C;
    fill.style.strokeDashoffset = (C * (1 - freshness)).toFixed(2);
    fill.style.opacity = freshness > 0.004 ? "1" : "0";

    // center
    var big = $("bigNum"), label = $("bigLabel");
    if (left > 0) {
      big.textContent = String(left);
      big.classList.toggle("long", false);
      label.textContent = left === 1 ? "day left" : "days left";
    } else if (left === 0) {
      big.textContent = "0";
      big.classList.toggle("long", false);
      label.textContent = "wash today";
    } else {
      big.textContent = String(-left);
      big.classList.toggle("long", false);
      label.textContent = (-left) === 1 ? "day late" : "days late";
    }

    // body accent
    document.body.classList.remove("fresh", "due", "late");
    document.body.classList.add(left < 0 ? "late" : left <= 0 ? "due" : "fresh");

    // status line
    var ago = elapsed <= 0 ? "Washed today" : (elapsed === 1 ? "Washed yesterday" : "Washed " + elapsed + " days ago");
    var txt = ago + " · every " + S.interval + (S.interval === 1 ? " day" : " days");
    if (snoozed) txt += " · snoozed";
    $("status").innerHTML = txt;

    // snooze button only when it's actually due
    $("snoozeBtn").hidden = left > 0;

    // streak
    var st = $("streak");
    if (S.onTime > 0) {
      st.hidden = false;
      $("streakNum").textContent = String(S.onTime);
    } else {
      st.hidden = true;
    }

    // window title = the reminder that shows in the taskbar
    if (left < 0) {
      document.title = "🧺 " + (-left) + " day" + ((-left) === 1 ? "" : "s") + " late!";
    } else if (left === 0) {
      document.title = "🧺 Wash today!";
    } else {
      document.title = "Laundry";
    }

    // be honest when the browser refuses to persist anything
    $("hint").textContent = STORAGE_OK
      ? "Leave this window open (or let it open with Windows) and the title bar will warn you on wash day."
      : "⚠ This browser isn't saving your progress. Open the app with \"laundry-reminder.bat\" instead.";
  }

  /* ---------- actions ---------- */
  function wash() {
    var t = today();
    var due = S.snoozeUntil && S.snoozeUntil > addDays(S.lastWashed, S.interval)
      ? S.snoozeUntil
      : addDays(S.lastWashed, S.interval);
    var left = diffDays(t, due);

    if (left >= 0) S.onTime += 1;
    S.washes += 1;
    S.lastWashed = t;
    S.snoozeUntil = null;
    save();
    render();
    burst();
  }

  function snooze() {
    S.snoozeUntil = addDays(today(), 1);
    save();
    render();
  }

  function burst() {
    var colors = ["#0d9488", "#f59e0b", "#6366f1", "#ef4444", "#10b981", "#0ea5e9"];
    for (var i = 0; i < 26; i++) {
      var p = document.createElement("span");
      p.className = "confetti";
      p.style.left = "50%";
      p.style.top = "42%";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--x", ((Math.random() * 2 - 1) * 150).toFixed(0) + "px");
      p.style.setProperty("--y", (-70 - Math.random() * 150).toFixed(0) + "px");
      p.style.setProperty("--r", (Math.random() * 540 - 270).toFixed(0) + "deg");
      p.style.animationDelay = (Math.random() * 0.08).toFixed(2) + "s";
      document.body.appendChild(p);
      (function (el) { setTimeout(function () { el.remove(); }, 1100); })(p);
    }
  }

  /* ---------- settings ---------- */
  function openSettings() {
    $("intervalVal").textContent = S.interval + (S.interval === 1 ? " day" : " days");
    $("lastWash").value = S.lastWashed;
    $("modal").hidden = false;
  }
  function closeSettings() { $("modal").hidden = true; }

  function setInterval_(n) {
    S.interval = Math.min(30, Math.max(1, n));
    $("intervalVal").textContent = S.interval + (S.interval === 1 ? " day" : " days");
    save();
    render();
  }

  /* ---------- wiring ---------- */
  $("washBtn").addEventListener("click", wash);
  $("snoozeBtn").addEventListener("click", snooze);
  $("settingsBtn").addEventListener("click", openSettings);
  $("doneBtn").addEventListener("click", closeSettings);
  $("minusBtn").addEventListener("click", function () { setInterval_(S.interval - 1); });
  $("plusBtn").addEventListener("click", function () { setInterval_(S.interval + 1); });
  $("lastWash").addEventListener("change", function (e) {
    if (!e.target.value || !parse(e.target.value)) return;
    S.lastWashed = e.target.value;
    S.snoozeUntil = null;
    save();
    render();
  });
  $("resetBtn").addEventListener("click", function () {
    S.onTime = 0;
    S.washes = 0;
    save();
    render();
  });
  $("modal").addEventListener("click", function (e) {
    if (e.target === $("modal")) closeSettings();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSettings();
  });

  /* keep the countdown honest if the window stays open overnight */
  setInterval(render, 60000);

  render();
})();
</script>
</body>
</html>
